[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bullet-scrape"
version = "1.0.0"
description = "High-performance C++ web scraper with Python / Google Colab bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Bullet Scrape contributors" }]
keywords = ["scraper", "web-scraping", "colab", "libcurl", "high-performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
colab = ["pandas>=1.3", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/gugu8intel-i9/Bullet-Scrape"
Repository = "https://github.com/gugu8intel-i9/Bullet-Scrape"

[tool.setuptools.packages.find]
where = ["."]
include = ["bullet_scrape*"]

[tool.setuptools.package-data]
bullet_scrape = ["libbullet_scrape.so", "libbullet_scrape.so.*", "libbullet_scrape.dylib", "py.typed"]
